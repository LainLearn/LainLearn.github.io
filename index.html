<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Esquive</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="jeu">
    <h1>Esquive</h1>
    <p class="regle">Déplace-toi avec les flèches ou ZQSD. Survis le plus longtemps possible. Un boss arrive au bout de 10 secondes.</p>

    <div class="barre">
      <p>Temps : <span id="temps">0</span> s</p>
      <p>Record : <span id="record">0</span> s</p>
    </div>

    <canvas id="scene" width="600" height="400"></canvas>

    <div id="finPartie" class="cache">
      <p id="messageFin"></p>
      <button id="rejouer" type="button">Rejouer</button>
    </div>
  </main>
</body>
</html>
